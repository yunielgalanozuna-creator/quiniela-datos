name: Actualizar resultados
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scrape.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add data.json history.json
          git diff --staged --quiet || (git commit -m "Actualizar resultados" && git push)
